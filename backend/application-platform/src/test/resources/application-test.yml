# 测试配置: 使用隔离的 companion_test 数据库, 避免干扰运行中的服务。
# 本模块没有 auth/llm/scheduler —— 那些属于 kernel 与 digital-human-platform, 这里都不在 classpath 上。
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/companion_test
    username: admin
    password: shared-secret
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
